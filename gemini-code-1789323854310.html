<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RADAR</title>
    <style>
        :root { --bg: #0a0a0a; --text: #f4f4f4; --accent: #ff2a2a; }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Helvetica Neue', Helvetica, Arial, sans-serif; }
        body { background: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; height: 100vh; padding-top: 10vh; }
        header { font-size: 2rem; font-weight: 700; letter-spacing: -1px; text-transform: uppercase; margin-bottom: 2rem; }
        .box { background: #1a1a1a; padding: 2rem; width: 320px; border: 1px solid #333; margin-bottom: 1rem; }
        .label { font-size: 0.8rem; text-transform: uppercase; color: #888; margin-bottom: 0.5rem; display: block; }
        .id-display { font-size: 2.5rem; font-weight: bold; color: var(--accent); letter-spacing: 2px; text-align: center; margin-bottom: 1rem; }
        input[type="text"] { width: 100%; padding: 1rem; background: var(--bg); border: 1px solid #333; color: var(--text); font-size: 1.2rem; text-align: center; margin-bottom: 1rem; outline: none; text-transform: uppercase;}
        button { width: 100%; background: var(--text); color: var(--bg); border: none; padding: 1rem; font-weight: bold; text-transform: uppercase; cursor: pointer; transition: background 0.2s; }
        button:hover { background: var(--accent); color: var(--text); }
        .recent-btn { background: transparent; border: 1px solid #333; color: #888; margin-top: 0.5rem; }
        .recent-btn:hover { background: #333; color: var(--text); }
        input[type="file"] { display: none; }
        #status { margin-top: 1rem; font-size: 0.9rem; color: #888; text-align: center; }
        #recentBox { display: none; }
    </style>
</head>
<body>

    <header>Radar.</header>

    <div class="box">
        <span class="label">Your Radar ID</span>
        <div class="id-display" id="myId">---</div>
    </div>

    <div class="box" id="connectBox">
        <span class="label">Connect to Peer</span>
        <input type="text" id="peerIdInput" placeholder="Enter ID" maxlength="4">
        <button id="connectBtn">Connect</button>
        
        <div id="recentBox">
            <span class="label" style="margin-top: 1.5rem;">Recent Connections</span>
            <div id="recentList"></div>
        </div>
    </div>

    <div class="box" id="transferBox" style="display: none;">
        <span class="label">Connected To: <span id="connectedToId"></span></span>
        <button id="sendFileBtn">Select & Send File</button>
        <input type="file" id="fileInput">
    </div>

    <div id="status">Waiting for network...</div>

    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script>
        const generateId = () => Math.random().toString(36).substring(2, 6).toUpperCase();
        const myId = generateId();
        document.getElementById('myId').innerText = myId;

        const peer = new Peer(myId);
        let conn;

        const statusEl = document.getElementById('status');
        const connectBox = document.getElementById('connectBox');
        const transferBox = document.getElementById('transferBox');
        const fileInput = document.getElementById('fileInput');
        const recentBox = document.getElementById('recentBox');
        const recentList = document.getElementById('recentList');

        // Load saved peers on startup
        loadRecentPeers();

        peer.on('open', () => {
            statusEl.innerText = "Ready to connect.";
        });

        // Handle incoming connection
        peer.on('connection', (connection) => {
            conn = connection;
            setupConnection(conn.peer);
        });

        // Initiate connection from input
        document.getElementById('connectBtn').onclick = () => {
            const peerId = document.getElementById('peerIdInput').value.toUpperCase();
            initiateConnection(peerId);
        };

        function initiateConnection(peerId) {
            if (!peerId) return;
            statusEl.innerText = "Connecting...";
            conn = peer.connect(peerId);
            setupConnection(peerId);
        }

        function setupConnection(connectedId) {
            conn.on('open', () => {
                statusEl.innerText = "Secure P2P connection established.";
                connectBox.style.display = 'none';
                transferBox.style.display = 'block';
                document.getElementById('connectedToId').innerText = connectedId;
                
                saveRecentPeer(connectedId);
            });

            conn.on('data', (data) => {
                if (data.file && data.filename) {
                    const blob = new Blob([data.file]);
                    const url = URL.createObjectURL(blob);
                    const a = document.createElement('a');
                    a.href = url;
                    a.download = data.filename;
                    a.click();
                    statusEl.innerText = `Received: ${data.filename}`;
                }
            });
        }

        function saveRecentPeer(id) {
            let recent = JSON.parse(localStorage.getItem('radar_recent') || '[]');
            if (!recent.includes(id)) {
                recent.unshift(id); // Add to beginning
                if (recent.length > 5) recent.pop(); // Keep only last 5
                localStorage.setItem('radar_recent', JSON.stringify(recent));
            }
        }

        function loadRecentPeers() {
            let recent = JSON.parse(localStorage.getItem('radar_recent') || '[]');
            if (recent.length > 0) {
                recentBox.style.display = 'block';
                recentList.innerHTML = '';
                recent.forEach(id => {
                    const btn = document.createElement('button');
                    btn.className = 'recent-btn';
                    btn.innerText = id;
                    btn.onclick = () => initiateConnection(id);
                    recentList.appendChild(btn);
                });
            }
        }

        // Handle File Sending
        document.getElementById('sendFileBtn').onclick = () => fileInput.click();
        
        fileInput.addEventListener('change', (event) => {
            const file = event.target.files[0];
            if (!file || !conn) return;

            statusEl.innerText = `Sending ${file.name}...`;
            
            const reader = new FileReader();
            reader.onload = (e) => {
                conn.send({
                    file: e.target.result,
                    filename: file.name
                });
                statusEl.innerText = "File sent successfully.";
            };
            reader.readAsArrayBuffer(file);
        });
    </script>
</body>
</html>
